name: Feature request
description: Suggest a new feature or enhancement for Obsidian Exchange
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea. Check `docs/` and existing issues first to avoid duplicates.
        **Never include secrets, `.env` contents, or private keys.**
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
      placeholder: As a ... I need ... because ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like.
      placeholder: Proposed behavior / API / UI ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack would this touch?
      options:
        - Backend/Core (v1/Obsidian-Core, Laravel 8)
        - Client/Frontend (v1/Obsidian-Client, Next.js 12)
        - Vault/Gateway (v1/Obsidian-Vault, Express)
        - Docs (docs/, v1/Obsidian-Documentation)
        - Multiple / Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?
      placeholder: Alternative approaches, existing workarounds ...
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
