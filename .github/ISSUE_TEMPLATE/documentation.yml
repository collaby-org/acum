name: Documentation issue
description: Report a gap, error, or improvement in the docs
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us fix the docs. Reference the exact page or file where possible.
  - type: input
    id: page
    attributes:
      label: Page reference
      description: File path or URL of the docs page (e.g. docs/project-doc.md, v1/Obsidian-Documentation/...).
      placeholder: docs/... or URL
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong or missing?
      description: Describe the gap, error, or outdated content.
      placeholder: This section says X but should say Y / page Z is missing ...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Proposed wording, structure, or content.
      placeholder: Suggested text or outline ...
    validations:
      required: false
