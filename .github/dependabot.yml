# Dependabot
#
# Dependencies for ACUM (Next.js 16 frontend in monorepo/frontend)
# Supabase schema in /supabase
# GitHub Actions in .github/workflows

version: 2
updates:
  # GitHub Actions - pinned by commit SHA in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
    # The opencode action lives in the "github" folder of the upstream
    # repository, and that folder is gone as of v2.2.x: the bumped commit
    # has no action.yml, so every workflow that uses it fails to start.
    # The repository stays on v2.0.9 until the action has a new home.
    ignore:
      - dependency-name: "anomalyco/opencode/github"

  # Frontend (Next.js 16 + React 19) - monorepo/frontend
  - package-ecosystem: "npm"
    directory: "/monorepo/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      minor-patch:
        patterns:
          - "*"
    # Next.js / React major bumps rewrite App Router, i18n, route segments
    # Must be deliberate, tested migrations — not unattended patches.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is out, but typescript-eslint (and eslint-config-next
      # with it) declares a peer range of ">=4.8.4 <6.1.0" — the lint step
      # cannot run against it yet. Bumping TypeScript alone turns the
      # "minor-patch" group red, so it waits until the linter catches up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Supabase migrations (SQL)
  - package-ecosystem: "npm"
    directory: "/supabase"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "supabase"
    groups:
      minor-patch:
        patterns:
          - "*"
