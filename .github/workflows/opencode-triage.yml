# .github/workflows/opencode-triage.yml
# Issue triage on open. `prompt` input is REQUIRED here (triage instructions).
# NOTE: `edited` was deliberately dropped from triggers: the only
# actor-describing association path (`sender.author_association`) is not a
# documented context path and evaluates empty (silently disabling the job),
# so `edited` cannot be gated on the actor. Triage runs on `opened`, where
# sender IS the author and the documented `issue.author_association` gate
# below describes the actor exactly.
# NOTE: there is NO official `fallback_models` key in opencode.json or in this
# action's inputs (verified). Rotation instead: a pick step rotates the PRIMARY
# across the ladder per (run_number + run_attempt) so free-tier load spreads
# evenly, and the remaining ladder entries retry in order via `if: failure()` +
# a skip-if-already-primary guard — never re-running the model that just failed.
#
# ADVISORY, NOT A GATE. Credential-gated: without LLM_API_KEY + LLM_API_BASE
# the job is SKIPPED (green, zero runner minutes) instead of failing.
name: opencode-triage

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  pull-requests: read
  issues: write

# One run per ref: repeated issue activity on the same ref collapses to one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    # Credential gate first: unconfigured -> skipped, not failed. `!= ''` on an
    # unset secret yields an empty string, so this evaluates false instead of
    # erroring.
    # Only trusted collaborators get agent triage with persisted credentials.
    # `opened`-only trigger means sender IS the author, so the documented
    # `issue.author_association` field gates the actor exactly.
    if: >-
      secrets.LLM_API_KEY != '' &&
      secrets.LLM_API_BASE != '' &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    # Advisory bot: never block a developer on a red agent run.
    continue-on-error: true
    # Hard spend cap across the primary + three fallback attempts.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Rotating primary: spreads free-tier load across all four models.
      # Index = (run_number + run_attempt - 2) % 4 -> every new run AND every
      # re-run of a failed run starts on the next ladder entry.
      - name: Pick model (rotate per run)
        id: pick_models
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          LADDER=("openai/deepseek-v4.1-flash-free" "openai/beam-free" "openai/glm-5.3-flash-free" "openai/mimo-v2.6-flash-free")
          IDX=$(( (RUN_NUMBER + RUN_ATTEMPT - 2) % ${#LADDER[@]} ))
          echo "primary=${LADDER[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Rotated to: ${LADDER[$IDX]} (index $IDX)"

      # Primary model: rotated per run
      - name: opencode triage (primary)
        id: opencode_triage_primary
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: ${{ steps.pick_models.outputs.primary }}
          prompt: >-
            Triage this GitHub issue: assign a clear title suggestion, apply
            appropriate labels (bug / enhancement / question / docs), note
            reproduction steps if it is a bug report, flag missing information
            by asking one concise follow-up question, and suggest priority
            (low/medium/high) with a one-line reason. Keep the reply short and
            actionable.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 1/3 — enabled.


      # (Was disabled to avoid retrying absent credentials; the replacement set is zen-native.)


      # (Fallbacks are enabled via if: failure().)
      - name: opencode triage (fallback deepseek-v4.1-flash-free)
        id: opencode_triage_fallback_big_pickle
        if: failure() && steps.pick_models.outputs.primary != 'openai/beam-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/deepseek-v4.1-flash-free
          prompt: >-
            Triage this GitHub issue: assign a clear title suggestion, apply
            appropriate labels (bug / enhancement / question / docs), note
            reproduction steps if it is a bug report, flag missing information
            by asking one concise follow-up question, and suggest priority
            (low/medium/high) with a one-line reason. Keep the reply short and
            actionable.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 2/3 — enabled.


      # (Was disabled to avoid retrying absent credentials; the replacement set is zen-native.)


      # (Fallbacks are enabled via if: failure().)
      - name: opencode triage (fallback glm-5.3-flash-free)
        id: opencode_triage_fallback_space_bunny
        if: failure() && steps.pick_models.outputs.primary != 'openai/glm-5.3-flash-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/glm-5.3-flash-free
          prompt: >-
            Triage this GitHub issue: assign a clear title suggestion, apply
            appropriate labels (bug / enhancement / question / docs), note
            reproduction steps if it is a bug report, flag missing information
            by asking one concise follow-up question, and suggest priority
            (low/medium/high) with a one-line reason. Keep the reply short and
            actionable.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 3/3 (last resort)
      - name: opencode triage (fallback mimo-v2.6-flash-free)
        id: opencode_triage_fallback_kimi
        if: failure() && steps.pick_models.outputs.primary != 'openai/mimo-v2.6-flash-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/mimo-v2.6-flash-free
          prompt: >-
            Triage this GitHub issue: assign a clear title suggestion, apply
            appropriate labels (bug / enhancement / question / docs), note
            reproduction steps if it is a bug report, flag missing information
            by asking one concise follow-up question, and suggest priority
            (low/medium/high) with a one-line reason. Keep the reply short and
            actionable.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
