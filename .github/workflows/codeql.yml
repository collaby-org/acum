# .github/workflows/codeql.yml
# CodeQL static analysis.
#
# No credential gate applies here: CodeQL authenticates with the automatic
# GITHUB_TOKEN. On a private repo with Actions billing blocked, this workflow
# fails before any step runs — nothing in this file can fix that, so the file
# only carries the cost/hardening changes that survive the billing fix.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "37 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # The weekly scan gets its own group. It used to share
  # `refs/heads/main` with every push, so an ordinary push would cancel the
  # scheduled run — and the scheduled run is the one that surfaces newly
  # published advisories against already-merged code.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Cost cap per matrix leg; keeps a stuck autobuild from burning minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      # The JS/TS leg genuinely needs a build to discover sources.
      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"