# .github/workflows/opencode-review.yml
# Automatic PR review on open/update. Uses the action's default review prompt
# (prompt input intentionally omitted).
# NOTE: there is NO official `fallback_models` key in opencode.json or in this
# action's inputs (verified). Rotation instead: a pick step rotates the PRIMARY
# across the ladder per (run_number + run_attempt) so load spreads
# evenly, and the remaining ladder entries retry in order via `if: failure()` +
# a skip-if-already-primary guard — never re-running the model that just failed.
#
# ADVISORY, NOT A GATE. Credential-gated: without LLM_API_KEY + LLM_API_BASE
# every step is SKIPPED (green, zero runner minutes) instead of failing. The
# check lives in the step conditions, fed by the job's `env` — the `secrets`
# context is not readable in a job-level `if:` and GitHub rejects the whole
# workflow graph there.
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One run per ref: N pushes to the same branch collapse into the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Credential gate first: unconfigured -> skipped, not failed. `!= ''` on an
    # unset secret yields an empty string, so this evaluates false instead of
    # erroring.
    # Same-repo PRs only (fail-closed): fork PRs must never run the agent
    # with any token against untrusted code paths. Explicit != null guard â€”
    # a missing head repo must deny, never pass on loose equality.
    # Credential gate: unconfigured -> every step below skips, so the job is
    # green rather than red. The `secrets` context is NOT readable in a
    # job-level `if:` (GitHub rejects the whole workflow graph with
    # "Unrecognized named-value: 'secrets'", which produced 0-job failed runs
    # with no log on every push), so it lives in the step conditions, fed by
    # the job's own `env`. Do not move it back to `if:`.
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo != null &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Advisory bot: never block a developer on a red agent run.
    continue-on-error: true
    # Hard spend cap across the primary + three fallback attempts.
    timeout-minutes: 20
    # The gate is read from the job's own `env`: the `secrets` context exists
    # there, and an unset key is an empty string.
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
    steps:
      - name: Checkout
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Rotating primary: spreads load across all four models.
      # Index = (run_number + run_attempt - 2) % 4 -> every new run AND every
      # re-run of a failed run starts on the next ladder entry.
      - name: Pick model (rotate per run)
        id: pick_models
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          LADDER=("openai/deepseek-ai/deepseek-v4.1-flash" "openai/z-ai/glm-5.3-flash" "openai/stepfun-ai/step-5-preview" "openai/nvidia/nemotron-3.5-super-vl-120b-a12b")
          IDX=$(( (RUN_NUMBER + RUN_ATTEMPT - 2) % ${#LADDER[@]} ))
          echo "primary=${LADDER[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Rotated to: ${LADDER[$IDX]} (index $IDX)"

      # Primary model: rotated per run (default review prompt)
      - name: opencode review (primary)
        id: opencode_review_primary
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: ${{ steps.pick_models.outputs.primary }}
          use_github_token: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 1/3 — enabled (glm-5.3-flash).
      - name: opencode review (fallback glm-5.3-flash)
        id: opencode_review_fallback_big_pickle
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/z-ai/glm-5.3-flash' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/z-ai/glm-5.3-flash
          use_github_token: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 2/3 — enabled (step-5-preview).
      - name: opencode review (fallback step-5-preview)
        id: opencode_review_fallback_space_bunny
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/stepfun-ai/step-5-preview' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/stepfun-ai/step-5-preview
          use_github_token: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 3/3 (last resort) — nemotron-3.5-super-vl-120b-a12b.
      - name: opencode review (fallback nemotron-3.5-super-vl-120b-a12b)
        id: opencode_review_fallback_kimi
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/nvidia/nemotron-3.5-super-vl-120b-a12b' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
          use_github_token: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
