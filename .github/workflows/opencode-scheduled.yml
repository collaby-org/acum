# .github/workflows/opencode-scheduled.yml
# Scheduled maintenance (weekly) + manual dispatch. `prompt` input is REQUIRED
# here (dependency/health-check instructions).
# NOTE: there is NO official `fallback_models` key in opencode.json or in this
# action's inputs (verified). Rotation instead: a pick step rotates the PRIMARY
# across the ladder per (run_number + run_attempt) so load spreads
# evenly, and the remaining ladder entries retry in order via `if: failure()` +
# a skip-if-already-primary guard — never re-running the model that just failed.
#
# ADVISORY, NOT A GATE. Credential-gated: without LLM_API_KEY + LLM_API_BASE
# every step is SKIPPED (green, zero runner minutes) instead of failing, so a
# weekly schedule with no key configured costs nothing. The check lives in the
# step conditions, fed by the job's `env` — the `secrets` context is not
# readable in a job-level `if:` and GitHub rejects the whole graph there.
name: opencode-scheduled

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

# One run per ref; cancels a superseded manual dispatch of the same run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled:
    # Credential gate: unconfigured -> every step below skips, so the job is
    # green rather than red.
    # NOTE: the `secrets` context is NOT readable in a job-level `if:`. GitHub
    # rejects the whole workflow graph with "Unrecognized named-value:
    # 'secrets'", and each push then produces a 0-job failed run with no log
    # at all — which is exactly what was happening. The check now lives in
    # the step conditions below, fed by the job's own `env`. Do not move it
    # back to `if:`.
    runs-on: ubuntu-latest
    # Advisory job: never block a developer on a red agent run.
    continue-on-error: true
    # Hard spend cap across the primary + three fallback attempts.
    timeout-minutes: 30
    # The gate is read from the job's own `env`: the `secrets` context exists
    # there, and an unset key is an empty string.
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
    steps:
      - name: Checkout
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No PR-branch fetch happens on schedule/workflow_dispatch events
          # (no pull_request payload, no "Checking out local branch" step),
          # and issue/PR creation goes through the API via GITHUB_TOKEN env â€”
          # so credentials are deliberately NOT persisted here.
          persist-credentials: false

      # Rotating primary: spreads load across all four models.
      # Index = (run_number + run_attempt - 2) % 4 -> every new run AND every
      # re-run of a failed run starts on the next ladder entry.
      - name: Pick model (rotate per run)
        id: pick_models
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          LADDER=("openai/deepseek-ai/deepseek-v4.1-flash" "openai/z-ai/glm-5.3-flash" "openai/stepfun-ai/step-5-preview" "openai/nvidia/nemotron-3.5-super-vl-120b-a12b")
          IDX=$(( (RUN_NUMBER + RUN_ATTEMPT - 2) % ${#LADDER[@]} ))
          echo "primary=${LADDER[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Rotated to: ${LADDER[$IDX]} (index $IDX)"

      # Primary model: rotated per run
      - name: opencode scheduled (primary)
        id: opencode_scheduled_primary
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: ${{ steps.pick_models.outputs.primary }}
          prompt: >-
            Run a weekly repository health check: scan for outdated
            dependencies, open security advisories, failing or flaky CI, stale
            open issues/PRs, and missing docs. If you find actionable items,
            open concise issues or small focused PRs (one concern per PR) with
            before/after evidence. If everything is healthy, post a one-line
            summary and do nothing else.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 1/3 — enabled (glm-5.3-flash).
      - name: opencode scheduled (fallback glm-5.3-flash)
        id: opencode_scheduled_fallback_big_pickle
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/z-ai/glm-5.3-flash' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/z-ai/glm-5.3-flash
          prompt: >-
            Run a weekly repository health check: scan for outdated
            dependencies, open security advisories, failing or flaky CI, stale
            open issues/PRs, and missing docs. If you find actionable items,
            open concise issues or small focused PRs (one concern per PR) with
            before/after evidence. If everything is healthy, post a one-line
            summary and do nothing else.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 2/3 — enabled (step-5-preview).
      - name: opencode scheduled (fallback step-5-preview)
        id: opencode_scheduled_fallback_space_bunny
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/stepfun-ai/step-5-preview' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/stepfun-ai/step-5-preview
          prompt: >-
            Run a weekly repository health check: scan for outdated
            dependencies, open security advisories, failing or flaky CI, stale
            open issues/PRs, and missing docs. If you find actionable items,
            open concise issues or small focused PRs (one concern per PR) with
            before/after evidence. If everything is healthy, post a one-line
            summary and do nothing else.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 3/3 (last resort) — nemotron-3.5-super-vl-120b-a12b.
      - name: opencode scheduled (fallback nemotron-3.5-super-vl-120b-a12b)
        id: opencode_scheduled_fallback_kimi
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/nvidia/nemotron-3.5-super-vl-120b-a12b' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
          prompt: >-
            Run a weekly repository health check: scan for outdated
            dependencies, open security advisories, failing or flaky CI, stale
            open issues/PRs, and missing docs. If you find actionable items,
            open concise issues or small focused PRs (one concern per PR) with
            before/after evidence. If everything is healthy, post a one-line
            summary and do nothing else.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
