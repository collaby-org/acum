# .github/workflows/kodus-review.yml
# Kodus review — CLI-in-CI pattern (no official Kodus GitHub Action exists).
#
# ADVISORY, NOT A GATE: findings are posted as PR review comments. This job
# never blocks a merge and never fails a developer's PR (continue-on-error).
# It is also credential-gated: with KODUS_API_URL / KODUS_TEAM_KEY unset every
# step is SKIPPED (green, zero runner minutes) instead of failing. The check
# cannot live in a job-level `if:` — the `secrets` context is not readable
# there and GitHub rejects the whole graph with "Unrecognized named-value:
# 'secrets'". It lives in the step conditions, fed by the job's `env`.
#
# Auth: KODUS_API_URL + KODUS_TEAM_KEY only (secret refs, never literals).
# Model routing is dashboard-only: Kodus Cloud CLI models are configured on the
# BYOK page, NOT via model/base_url env vars in this workflow.
#
# Required dashboard BYOK routing (all bots now on the NVIDIA endpoint):
#   primary  = z-ai/glm-5.3-flash  (NVIDIA base https://integrate.api.nvidia.com/v1)
#   fallback = deepseek-ai/deepseek-v4.1-flash
#   fallback = stepfun-ai/step-5-preview
# PR-Agent primary is DeepSeek V4.1 Flash - Kodus GitHub primary stays GLM so
# the two bots never share a primary. Local self-hosted Kodus uses DeepSeek
# (see docs/kodus-providers.md).
name: Kodus Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One run per ref: N pushes to the same branch collapse into the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kodus_review:
    # Unconfigured -> the steps below all skip, so the job is green rather
    # than red.
    # NOTE: the `secrets` context is NOT readable in a job-level `if:`.
    # GitHub rejects the whole workflow graph with "Unrecognized named-value:
    # 'secrets'", and every push then produces a 0-job failed run with no log
    # at all - which is exactly what was happening. The credential check now
    # lives in the step conditions below, fed by the job's own `env`. Do not
    # move it back to `if:`.
    runs-on: ubuntu-latest
    # Advisory bot: never block a developer on a red Kodus run.
    continue-on-error: true
    # Hard spend cap for the LLM call.
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    # The gate is read from the job's own `env`: the `secrets` context exists
    # there, and so does an empty string when a key is unset.
    env:
      KODUS_API_URL: ${{ secrets.KODUS_API_URL }}
      KODUS_TEAM_KEY: ${{ secrets.KODUS_TEAM_KEY }}
    steps:
      - name: Checkout
        if: ${{ env.KODUS_API_URL != '' && env.KODUS_TEAM_KEY != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: ${{ env.KODUS_API_URL != '' && env.KODUS_TEAM_KEY != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.0'

      # No --fail-on error: findings are reported, not enforced.
      - name: Kodus review (advisory)
        if: ${{ env.KODUS_API_URL != '' && env.KODUS_TEAM_KEY != '' }}
        run: npx -y @kodus/cli review --format json
        env:
          KODUS_API_URL: ${{ secrets.KODUS_API_URL }}
          KODUS_TEAM_KEY: ${{ secrets.KODUS_TEAM_KEY }}