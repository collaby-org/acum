# Daily EPG refresh — ACUM
#
# The programme guide is scraped from canaletvlive.online into
# monorepo/frontend/data/epg.json. The app derives "now" from the
# programme timestamps at read time, so a stale file makes the hero, the
# channel screens and the " URMEAZĂ" badges lag behind — the file has to
# be refreshed every day.
#
# The scrape writes data/epg.json; the job commits that change onto a
# branch and opens a pull request when it differs from what is on the
# branch. It runs on a schedule and can be started by hand.
#
# Why a branch and not main: main is protected and the repository does not
# enforce rules on its owner — so a human push lands, while the
# github-actions token is refused with GH006 ("protected branch update
# failed"), which is how this refresh silently failed every morning. A
# pull request is what the token is allowed to open.
#
# To refresh main directly instead, add a secret holding a token with
# write access (a PAT with the `repo` scope), name it EPG_PUSH_TOKEN, and
# push with it:
#
#     git push "https://x-access-token:${EPG_PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

name: EPG refresh

on:
  schedule:
    # 04:20 UTC — 07:20 Bucharest in summer, 06:20 in winter. Early
    # enough that the guide covers the Romanian working day, late enough
    # that the source has published the new day's flights.
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: epg-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Scrape data/epg.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monorepo/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monorepo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scrape the guide
        run: npm run data:epg

      - name: Commit when the guide changed
        run: |
          if git diff --quiet -- data/epg.json; then
            echo "data/epg.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A branch of its own, force-moved each morning: the guide is a
          # generated file, so its history on that branch is noise.
          git checkout -B chore/epg-refresh
          git add data/epg.json
          git commit -m "chore: refresh data/epg.json (daily scrape)"
          git push --force origin chore/epg-refresh

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A PR that is already open is a success: the morning's data sits
          # in it and only needs a merge.
          if gh pr list --head chore/epg-refresh --base main --json number --jq 'length' | grep -q '[1-9]'; then
            echo "A pull request is already open for this branch"
            exit 0
          fi

          # Otherwise open one. GitHub refuses this when the repository does
          # not allow Actions to create pull requests, and it refuses a
          # push to main when the branch is protected — neither is a
          # silent no-op, so both end the run with what to do about it.
          if ! gh pr create \
            --title "chore: refresh the programme guide (daily scrape)" \
            --body "The daily scrape refreshed \`monorepo/frontend/data/epg.json\`. The app derives what is on now from these timestamps, so this is what keeps the hero, the channel screens and the URMEAZĂ badges honest. Merging it is the whole point — the earlier version of this job pushed straight to main and was refused by branch protection (GH006) every morning." \
            --base main \
            --head chore/epg-refresh; then
            echo "::error::The refreshed guide is on the branch chore/epg-refresh, but no pull request could be opened. GitHub refuses Actions-created pull requests unless the repository allows it: Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Or skip pull requests entirely: add a secret named EPG_PUSH_TOKEN holding a token with write access (a PAT with the repo scope) and change the push step to push HEAD to main with it."
            exit 1
          fi
