# EPG refresh — ACUM
#
# Scrapes the programme guide from canaletvlive.online into
# monorepo/frontend/data/epg.json — the fallback copy of the guide, which
# the app reads only when the source itself cannot be reached.
#
# The app no longer depends on this file: `src/lib/guide.ts` reads the
# source directly at runtime, behind Next's own cache, so the live guide keeps
# itself without anyone merging a file. The committed fallback is still
# refreshed twice a day (02:23 and 14:23 UTC), and it can also be run by hand:
# Actions → EPG refresh → Run workflow.
#
# An earlier version of this job ran on a schedule until the branch protection
# and the "Actions may not create pull requests" permission turned every
# morning into a failed run. It now pushes to main with EPG_PUSH_TOKEN when
# one is available; without it, it commits onto chore/epg-refresh and tries to
# open a pull request.

name: EPG refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
    - cron: "23 14 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: epg-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Scrape data/epg.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monorepo/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monorepo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scrape the guide
        id: scrape
        run: npm run data:epg

      - name: Report guide state
        if: always()
        continue-on-error: true
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!summaryPath) {
            console.log("GITHUB_STEP_SUMMARY is unavailable; skipping the guide report.");
            process.exit(0);
          }

          const append = (line) => fs.appendFileSync(summaryPath, `${line}\n`);

          try {
            if (process.env.SCRAPE_OUTCOME !== "success") {
              append("## EPG guide state");
              append("");
              append(`- Refresh outcome: **${process.env.SCRAPE_OUTCOME || "not run"}**`);
              append("- The guide was not refreshed, so its state is not reported.");
              process.exit(0);
            }

            const guide = JSON.parse(fs.readFileSync("data/epg.json", "utf8"));
            const channels = Object.values(guide.channels ?? {});
            const programmeCount = channels.reduce(
              (total, channel) =>
                total + (Array.isArray(channel.programmes) ? channel.programmes.length : 0),
              0,
            );
            const channelsWithGuide = channels.filter(
              (channel) => Array.isArray(channel.programmes) && channel.programmes.length > 0,
            ).length;
            const channelsWithoutGuide = Array.isArray(guide.channelsWithoutGuide)
              ? guide.channelsWithoutGuide.length
              : 0;
            const days = Array.isArray(guide.days)
              ? guide.days.join(", ")
              : (guide.date ?? "unknown");

            append("## EPG guide state");
            append("");
            append(`- Guide date: **${guide.date ?? "unknown"}**`);
            append(`- Generated at: **${guide.generatedAt ?? "unknown"}**`);
            append(`- Days covered: **${days}**`);
            append(`- Channels: **${guide.channelCount ?? channels.length}**`);
            append(`- Channels with programmes: **${channelsWithGuide}**`);
            append(`- Programmes: **${programmeCount}**`);
            append(`- Channels without a guide: **${channelsWithoutGuide}**`);
          } catch (error) {
            try {
              append("## EPG guide state");
              append("");
              append(`- Could not read the guide state: **${error.message}**`);
            } catch {
              console.error("Could not write the guide report to the job summary.");
            }
          }
          NODE

      - name: Commit when the guide changed
        # A scheduled run must never turn the workflow red: the guide is a
        # fallback copy, and a branch-protection refusal is a fact to
        # report, not a failure of the app.
        id: commit
        continue-on-error: true
        env:
          # A token with write access, when the repository has one. With it
          # the guide lands on main by itself and the pull request is not
          # needed; without it the run falls through to the branch below.
          EPG_PUSH_TOKEN: ${{ secrets.EPG_PUSH_TOKEN }}
        run: |
          if git diff --quiet -- data/epg.json; then
            echo "data/epg.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epg.json
          git commit -m "chore: refresh data/epg.json (scrape)"

          if [ -n "$EPG_PUSH_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${EPG_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
            echo "Pushed to main with the repository token."
            exit 0
          fi

          # A branch of its own, force-moved each run: the guide is a
          # generated file, so its history on that branch is noise. The
          # lease keeps the push from overwriting a commit that arrived
          # from somewhere else in the meantime.
          git checkout -B chore/epg-refresh
          git push --force-with-lease origin chore/epg-refresh

      - name: Open the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A PR that is already open is a success: the morning's data sits
          # in it and only needs a merge.
          if gh pr list --head chore/epg-refresh --base main --json number --jq 'length' | grep -q '[1-9]'; then
            echo "A pull request is already open for this branch"
            exit 0
          fi

          # Otherwise open one. GitHub refuses this when the repository does
          # not allow Actions to create pull requests, and it refuses a
          # push to main when the branch is protected — neither is a
          # silent no-op, so both end the run with what to do about it.
          if ! gh pr create \
            --title "chore: refresh the programme guide (daily scrape)" \
            --body "The daily scrape refreshed \`monorepo/frontend/data/epg.json\`. The app derives what is on now from these timestamps, so this is what keeps the hero, the channel screens and the URMEAZĂ badges honest. Merging it is the whole point — the earlier version of this job pushed straight to main and was refused by branch protection (GH006) every morning." \
            --base main \
            --head chore/epg-refresh; then
            echo "::warning::The refreshed guide is on the branch chore/epg-refresh, but no pull request could be opened. GitHub refuses Actions-created pull requests unless the repository allows it: Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Or skip pull requests entirely: add a secret named EPG_PUSH_TOKEN holding a token with write access (a PAT with the repo scope) and change the push step to push HEAD to main with it."
            exit 0
          fi

      - name: Report the outcome
        if: always()
        continue-on-error: true
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          {
            echo ""
            echo "### Outcome"
            echo ""
            echo "- Refresh: **${{ steps.scrape.outcome || 'not run' }}**"
            echo "- Commit: **${{ steps.commit.outcome || 'not run' }}**"
            if [ "$COMMIT_OUTCOME" != "success" ]; then
              echo "- The guide was refreshed but could not be committed. The app reads the live guide at runtime, so this does not affect what the visitor sees; the committed fallback stays as it was."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
