# .github/workflows/opencode.yml
# Mentions responder: replies to /oc or /opencode mentions in comments.
# NOTE: there is NO official `fallback_models` key in opencode.json or in this
# action's inputs (verified). Rotation instead: a pick step rotates the PRIMARY
# across the ladder per (run_number + run_attempt) so free-tier load spreads
# evenly, and the remaining ladder entries retry in order via `if: failure()` +
# a skip-if-already-primary guard — never re-running the model that just failed.
#
# ADVISORY, NOT A GATE. Credential-gated: without LLM_API_KEY + LLM_API_BASE
# the job is SKIPPED (green, zero runner minutes) instead of failing.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

# One run per ref: repeated pushes/comments on the same ref collapse to one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    # Only trusted collaborators can invoke the agent. Anyone can comment, so
    # without the author-association gate any user could steer the agent
    # while write-scoped credentials are persisted in git config.
    # Same-repo guard for review-thread comments: pull_request_review_comment
    # events on fork PRs must not run (explicit != null so a missing head
    # repo denies instead of passing).
    # issue_comment carries no `pull_request` object, so it is restricted to
    # non-PR issues only: /oc on a PR conversation tab no longer fires here
    # (PR surface stays pull_request_review_comment + automatic opencode-review).
    # All authorization clauses live inside ONE outer group: GHA binds &&
    # tighter than ||, so an ungrouped top-level || would let the /oc path
    # bypass every gate below and run with persisted write credentials.
    # Credential gate first: unconfigured -> skipped, not failed. `!= ''` on an
    # unset secret yields an empty string, so this evaluates false instead of
    # erroring. It sits inside the outer authorization group below, so the
    # /oc path cannot bypass it.
    if: >-
      secrets.LLM_API_KEY != '' &&
      secrets.LLM_API_BASE != '' &&
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')) &&
      (github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name != 'pull_request_review_comment' ||
      (github.event.pull_request.head.repo != null &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'issue_comment' ||
      github.event.issue.pull_request == null))
    runs-on: ubuntu-latest
    # Advisory bot: never block a developer on a red agent run.
    continue-on-error: true
    # Hard spend cap across the primary + three fallback attempts.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Rotating primary: spreads free-tier load across all four models.
      # Index = (run_number + run_attempt - 2) % 4 -> every new run AND every
      # re-run of a failed run starts on the next ladder entry.
      - name: Pick model (rotate per run)
        id: pick_models
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          LADDER=("openai/deepseek-v4.1-flash-free" "openai/beam-free" "openai/glm-5.3-flash-free" "openai/mimo-v2.6-flash-free")
          IDX=$(( (RUN_NUMBER + RUN_ATTEMPT - 2) % ${#LADDER[@]} ))
          echo "primary=${LADDER[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Rotated to: ${LADDER[$IDX]} (index $IDX)"

      # Primary model: rotated per run
      - name: opencode (primary)
        id: opencode_primary
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: ${{ steps.pick_models.outputs.primary }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 1/3 — enabled.


      # (Was disabled to avoid retrying absent credentials; the replacement set is zen-native.)


      # (Fallbacks are enabled via if: failure().)
      - name: opencode (fallback deepseek-v4.1-flash-free)
        id: opencode_fallback_big_pickle
        if: failure() && steps.pick_models.outputs.primary != 'openai/beam-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/deepseek-v4.1-flash-free
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 2/3 — enabled.


      # (Was disabled to avoid retrying absent credentials; the replacement set is zen-native.)


      # (Fallbacks are enabled via if: failure().)
      - name: opencode (fallback glm-5.3-flash-free)
        id: opencode_fallback_space_bunny
        if: failure() && steps.pick_models.outputs.primary != 'openai/glm-5.3-flash-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/glm-5.3-flash-free
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 3/3 (last resort)
      - name: opencode (fallback mimo-v2.6-flash-free)
        id: opencode_fallback_kimi
        if: failure() && steps.pick_models.outputs.primary != 'openai/mimo-v2.6-flash-free'
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/mimo-v2.6-flash-free
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
