# .github/workflows/opencode.yml
# Mentions responder: replies to /oc or /opencode mentions in comments.
# NOTE: there is NO official `fallback_models` key in opencode.json or in this
# action's inputs (verified). Rotation instead: a pick step rotates the PRIMARY
# across the ladder per (run_number + run_attempt) so load spreads
# evenly, and the remaining ladder entries retry in order via `if: failure()` +
# a skip-if-already-primary guard — never re-running the model that just failed.
#
# ADVISORY, NOT A GATE. Credential-gated: without LLM_API_KEY + LLM_API_BASE
# every step is SKIPPED (green, zero runner minutes) instead of failing. The
# credential check lives in the step conditions, fed by the job's `env` — the
# `secrets` context is not readable in a job-level `if:` and GitHub rejects the
# whole workflow graph there.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

# One run per ref: repeated pushes/comments on the same ref collapse to one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    # Only trusted collaborators can invoke the agent. Anyone can comment, so
    # without the author-association gate any user could steer the agent
    # while write-scoped credentials are persisted in git config.
    # Same-repo guard for review-thread comments: pull_request_review_comment
    # events on fork PRs must not run (explicit != null so a missing head
    # repo denies instead of passing).
    # issue_comment carries no `pull_request` object, so it is restricted to
    # non-PR issues only: /oc on a PR conversation tab no longer fires here
    # (PR surface stays pull_request_review_comment + automatic opencode-review).
    # All authorization clauses live inside ONE outer group: GHA binds &&
    # tighter than ||, so an ungrouped top-level || would let the /oc path
    # bypass every gate below and run with persisted write credentials.
    # Credential gate first: unconfigured -> every step below is SKIPPED
    # (green, zero runner minutes) instead of failed.
    # NOTE: the `secrets` context is NOT readable in a job-level `if:` — GitHub
    # rejects the whole workflow graph with "Unrecognized named-value:
    # 'secrets'", which is why every push produced a 0-job failed run with no
    # log at all. The credential check therefore lives in the step conditions
    # below, fed by the job's own `env`, and this `if:` carries only the
    # authorization clauses (all `github.*`, which IS readable here).
    # Do not move the secret check back into this expression.
    if: >-
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')) &&
      (github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name != 'pull_request_review_comment' ||
      (github.event.pull_request.head.repo != null &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'issue_comment' ||
      github.event.issue.pull_request == null))
    runs-on: ubuntu-latest
    # Advisory bot: never block a developer on a red agent run.
    continue-on-error: true
    # Hard spend cap across the primary + three fallback attempts.
    timeout-minutes: 20
    # The gate is read from the job's own `env`: the `secrets` context exists
    # there, and an unset key is an empty string.
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
    steps:
      - name: Checkout
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Rotating primary: spreads load across all four models.
      # Index = (run_number + run_attempt - 2) % 4 -> every new run AND every
      # re-run of a failed run starts on the next ladder entry.
      - name: Pick model (rotate per run)
        id: pick_models
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          LADDER=("openai/deepseek-ai/deepseek-v4.1-flash" "openai/z-ai/glm-5.3-flash" "openai/stepfun-ai/step-5-preview" "openai/nvidia/nemotron-3.5-super-vl-120b-a12b")
          IDX=$(( (RUN_NUMBER + RUN_ATTEMPT - 2) % ${#LADDER[@]} ))
          echo "primary=${LADDER[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Rotated to: ${LADDER[$IDX]} (index $IDX)"

      # Primary model: rotated per run
      - name: opencode (primary)
        id: opencode_primary
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: ${{ steps.pick_models.outputs.primary }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 1/3 — enabled (glm-5.3-flash).
      - name: opencode (fallback glm-5.3-flash)
        id: opencode_fallback_big_pickle
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/z-ai/glm-5.3-flash' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/z-ai/glm-5.3-flash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 2/3 — enabled (step-5-preview).
      - name: opencode (fallback step-5-preview)
        id: opencode_fallback_space_bunny
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/stepfun-ai/step-5-preview' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/stepfun-ai/step-5-preview
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback 3/3 (last resort) — nemotron-3.5-super-vl-120b-a12b.
      - name: opencode (fallback nemotron-3.5-super-vl-120b-a12b)
        id: opencode_fallback_kimi
        if: ${{ env.LLM_API_KEY != '' && env.LLM_API_BASE != '' && failure() && steps.pick_models.outputs.primary != 'openai/nvidia/nemotron-3.5-super-vl-120b-a12b' }}
        uses: anomalyco/opencode/github@6608799d35d96c2821a48ac1d4b26a3b84b4e433 # v2.0.9
        with:
          model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
