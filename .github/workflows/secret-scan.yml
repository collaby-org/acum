# .github/workflows/secret-scan.yml
# Secret scanning — the check the protected branch reads by the name
# "gitleaks".
#
# Runs the gitleaks CLI directly instead of gitleaks/gitleaks-action@v3. That
# action demands a GITLEAKS_LICENSE secret on organisation-owned repos and
# fails without it; the CLI needs no secret at all, so this workflow stays
# green when unconfigured. The `github-token` input is gone for that reason.
#
# The job is named "gitleaks" because that is the exact status context the
# protected branch requires. A check under any other name is never read by
# the branch, which is how a pull request could sit blocked on a check that
# no workflow ever reported.
#
# Cost control:
#   pull_request -> shallow checkout (fetch-depth 1), working-tree scan only.
#   push/schedule -> full history (fetch-depth 0), git-history scan.
#
# The rules live in .gitleaks.toml at the root of the repository.
name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "12 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # The protected branch asks for a status check named exactly
    # "gitleaks". This job reports that name, so the branch can read it.
    name: gitleaks
    runs-on: ubuntu-latest
    # A leak makes the step red (so it is visible in the log and the report
    # artifact). The workflow run itself carries on; the check stays red and
    # the protected branch does not accept it.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow for PRs (working-tree scan); full history otherwise.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      # Installs the pinned release and verifies its checksum. The install
      # script that used to live on gitleaks' `main` branch is gone (404),
      # and its absence turned this scan red on every pull request — the
      # step failed before it ever looked at the code.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version

      # Command names changed in gitleaks 8.25 (`detect` split into `git` /
      # `dir`), so probe rather than pin one spelling.
      - name: Scan PR diff (working tree, shallow checkout)
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          if gitleaks dir --help >/dev/null 2>&1; then
            gitleaks dir . --redact --verbose --report-format json --report-path gitleaks-report.json
          else
            gitleaks detect --source . --no-git --redact --verbose --report-format json --report-path gitleaks-report.json
          fi

      - name: Scan git history (push / schedule)
        if: github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git . --redact --verbose --report-format json --report-path gitleaks-report.json
          else
            gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7