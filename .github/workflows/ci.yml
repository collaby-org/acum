# CI â€” ACUM Monorepo

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend CI - runs from monorepo/frontend
  frontend:
    name: Frontend - Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monorepo/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monorepo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # TV CI - runs from monorepo/tv. Its own job, its own install, its own
  # build: a television release must not wait on the phone, and it must not
  # be able to break it.
  #
  # The `verify:nav` harness (the D-pad and the cursor rule) is deliberately
  # NOT part of this job: it drives a real Edge over the DevTools protocol
  # and it needs the browser binary of the machine it runs on, which a Linux
  # runner does not have. It stays a local gate, run against the production
  # build before a television release.
  tv:
    name: TV - Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monorepo/tv

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monorepo/tv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # The gate the protected branch asks for by name: "Lint, type-check and
  # build". The two jobs above are the real work; this one waits for both
  # and gives the branch protection a single answer to read. It is written
  # with `if: always()` on purpose — a skipped job would look like a pass,
  # and a green gate must mean both apps were really checked.
  gate:
    name: Lint, type-check and build
    needs: [frontend, tv]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Both apps are green
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TV_RESULT: ${{ needs.tv.result }}
        run: |
          echo "frontend: ${FRONTEND_RESULT}"
          echo "tv: ${TV_RESULT}"
          if [ "${FRONTEND_RESULT}" != "success" ] || [ "${TV_RESULT}" != "success" ]; then
            echo "::error::The web app and the television app must both pass lint, type check and build."
            exit 1
          fi
          echo "Both apps passed lint, type check and build."
