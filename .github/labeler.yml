# Labeler rules for ACUM
#
# Automatically applies labels based on changed files.

frontend:
  - changed-files:
      - "monorepo/frontend/**"

tv:
  - changed-files:
      - "monorepo/tv/**"
      - "tizen-tv/**"
      - "webos-tv/**"
      - "android-tv/**"

supabase:
  - changed-files:
      - "supabase/**"

scripts:
  - changed-files:
      - "scripts/**"
      - "data/**"
      - "src/data/**"

docs:
  - changed-files:
      - "docs/**"
      - "*.md"
      - "**/*.md"

ci:
  - changed-files:
      - ".github/**"

design-system:
  - changed-files:
      - "design-system/**"

tv-apps:
  - changed-files:
      - "tizen-tv/**"
      - "webos-tv/**"
      - "android-tv/**"