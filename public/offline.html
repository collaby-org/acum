<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06070a" />
    <title>VIZOR — fără conexiune</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-400-700-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #06070a;
        color: #f2f4f8;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 30rem;
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.03);
        text-align: center;
      }

      .badge {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border-radius: 14px;
        background: linear-gradient(
          135deg,
          #ffc247 0%,
          #f0a500 48%,
          #b87900 100%
        );
        color: #141005;
        box-shadow:
          0 12px 30px -10px rgba(240, 165, 0, 0.85),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
        font-size: 22px;
        line-height: 1;
      }

      .badge svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.1;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        margin: 28px 0 0;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      p {
        margin: 14px 0 0;
        font-size: 15px;
        line-height: 1.65;
        color: #949cad;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }

      .btn-primary {
        background: #f0a500;
        color: #141005;
        box-shadow: 0 14px 34px -14px rgba(240, 165, 0, 0.9);
      }

      .btn-ghost {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #f2f4f8;
      }

      .wordmark {
        margin-top: 32px;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #616a7b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h.01" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 3.3-2.3" />
          <path d="M15.6 10.6A10 10 0 0 1 19 12.9" />
          <path d="M2 8.8a15 15 0 0 1 5-3.2" />
          <path d="M17 5.6a15 15 0 0 1 5 3.2" />
          <path d="m2 2 20 20" />
        </svg>
      </span>
      <h1>Fără conexiune</h1>
      <p>
        Canalele TV live au nevoie de internet. Când reveniți online, apăsați
        din nou — VIZOR reia de unde ați rămas.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Înapoi la canale</a>
        <button class="btn btn-ghost" type="button" onclick="location.reload()">
          Reîncarcă
        </button>
      </div>
      <p class="wordmark">VIZOR</p>
    </main>
  </body>
</html>
