# Gitleaks configuration for ACUM.
#
# The default rule set stays in force. Only the places listed below are
# carved out, and every one of them is explained in place: they carry
# values that look like credentials but are not, and they are known,
# reviewed and public by construction.
#
# The scanner's own verdict is what the protected branch reads. The scan
# runs over the whole working tree for a pull request and over the whole
# history for a push, so both paths are covered by the same rules.
#
# Older findings that already live in the history are listed one by one in
# .gitleaksignore, each with the commit it belongs to. A file is never
# silenced as a whole: a new value in it is still reported.
title = "ACUM secret scan"

[extend]
useDefault = true

[allowlist]
description = "Known values that are not credentials"
paths = [
  # The OpenCode skill library is documentation that ships with the
  # repository, not application code. Its examples carry placeholder keys
  # ("const API_KEY = 'sk-...'"), which the scanner reads as live
  # credentials. No file in this folder is ever shipped to a visitor.
  '''^\.agents/skills/''',
  # The quality catalogue carries the public HLS address of every measured
  # stream, because that address has to reach the browser to play. The
  # token inside it is part of a public stream address, not an account
  # credential, and the file is regenerated by the measuring scripts.
  '''(^|/)data/quality\.json$''',
  # The build output of the two apps. It is never committed, and it holds
  # copies of the values above, so a local scan of the working tree would
  # report them a second time.
  '''(^|/)\.next/''',
]
